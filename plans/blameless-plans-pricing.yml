description: >-
  Blameless publishes no plans. The pricing page redirects to the acquirer's: as of
  2026-08-29 https://www.blameless.com/pricing answers 302 to https://firehydrant.com/pricing,
  and every other Blameless path redirects to the FireHydrant homepage. No Blameless tier,
  price, quota or overage is published anywhere, and no API-metered plan ever was — API
  access was included with the platform and credentials were issued by Customer Success.
