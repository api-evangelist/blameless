specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Blameless
providerId: blameless
generated: '2026-08-29'
method: searched
source: probes of https://docs.blameless.com (NXDOMAIN) and https://www.blameless.com/* (302 -> firehydrant.com), 2026-08-29
created: '2026-05-04'
modified: '2026-08-29'
tags:
  - AIOps
  - SRE
description: >-
  Blameless publishes no rate limits. The reference that would have carried them
  (docs.blameless.com) no longer resolves in DNS, and no limit, window, burst ceiling or
  429 response-header contract is recoverable from any surviving Blameless surface. The
  company's own client code offers one indirect signal and no more: the Go sample client
  configures three retries with a flat five-second wait, and the Node client retries only
  on 401, neither of which reads a rate-limit header.
limit_count: 0
limits: []
headers: {}
responseCodes: {}
observations:
  - source: https://github.com/blamelesshq/blameless-api-samples/blob/main/go/slo/packages/clients/blameless.go
    note: SetRetryCount(3) with SetRetryWaitTime(5s) — fixed backoff, no Retry-After handling.
  - source: https://github.com/blamelesshq/blameless-openslo/blob/main/src/blameless-delete/handlers/shared/apiCall.js
    note: Axios response interceptor handles 401 only; 429 is not handled.
history:
  - date: '2026-08-29'
    note: >-
      Replaced a five-entry scaffold written by the 2026-05-04 bulk sweep. Its per-tier
      limits (10/100/1000 rpm, 1k/100k monthly quotas) and its X-RateLimit-* header contract
      were generated defaults, never published by Blameless. Removed rather than carried
      forward.
