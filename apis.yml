aid: blameless
name: Blameless
description: >-
  Blameless was an SRE and incident management platform for reliability engineering teams,
  covering the full incident lifecycle — detection and response, on-call and severity
  workflows, blameless retrospectives, and SLOs with error budgets. It sold to enterprise
  reliability organizations including CrowdStrike, Palo Alto Networks, VMware and
  Ticketmaster. FireHydrant acquired Blameless on 2024-08-21 and has since absorbed the
  product; as of 2026-08-29 blameless.com redirects to firehydrant.com, docs.blameless.com
  and the *.blameless.io tenant hosts no longer resolve, and the tenant-templated REST/RPC
  API at https://{instance}.blameless.io/api/v1 is retired. What survives is the public
  blamelesshq GitHub organization, two npm packages, a Terraform Registry provider, and a
  live Auth0 identity tenant.
