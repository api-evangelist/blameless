specification: API Commons Lifecycle
specificationVersion: '0.1'
provider: Blameless
providerId: blameless
status: retired
summary: >-
  Blameless was acquired by FireHydrant on 2024-08-21 and has since been fully absorbed.
  As of 2026-08-29 the Blameless API surface is gone: www.blameless.com blanket-redirects
  to firehydrant.com, docs.blameless.com has no DNS record, and the *.blameless.io tenant
  hosts the API, CLI and Terraform provider authenticated against no longer resolve. The
  only Blameless surfaces still reachable are the GitHub organization and two npm packages
  plus one Terraform Registry provider, none republished since April 2024.
acquisition:
  acquirer: FireHydrant
  acquirer_provider: https://apis.io/providers/firehydrant/
  announced: '2024-08-21'
  press_release: https://firehydrant.com/blog/press-release-firehydrant-acquires-blameless-to-further-solidify-enterprise/
  coverage: https://techcrunch.com/2024/08/21/two-incident-management-startups-join-forces-as-firehydrant-nabs-blameless/
  terms: undisclosed
  note: >-
    Blameless board members Vas Natarajan (Accel) and Dan Moskowitz (Third Point Ventures)
    joined the FireHydrant board as part of the transaction. Enterprise Blameless customers
    named in coverage include CrowdStrike, Palo Alto Networks, VMware and Ticketmaster.
end_of_life:
  product: retired
  api: retired
  documentation: removed
  effective_observed: '2026-08-29'
  note: >-
    No dated sunset notice, deprecation policy, Sunset/Deprecation header policy (RFC 8594)
    or migration guide was ever published on a Blameless host that survives. The wind-down
    is recorded here from the state of the hosts themselves, not from a provider statement.
