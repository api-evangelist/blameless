historical_api:
  style: REST + RPC-over-HTTP
  versioning: path
  version: v1
  base_url_pattern: https://{instance}.blameless.io/api/v1
  base_url_status: unresolvable
  note: >-
    The base URL was tenant-templated: each customer called their own instance host. Two
    shapes are attested in first-party code and in the (now-removed) reference —
    resource-style paths such as /api/v1/incidents and /api/v1/incidents/{incidentId}/events,
    and an RPC-style /api/v1/services/{Service}/{Method} used by the SLO client
    (SLOServiceCrud, SLOTimeSeriesServiceCrud). No baseURL is written into apis.yml because
    no instance host resolves; recording one would assert a callable host that does not exist.
  evidence:
    - https://github.com/blamelesshq/blameless-api-samples/blob/main/go/slo/packages/clients/blameless.go
    - https://github.com/blamelesshq/terraform-provider-blameless/blob/main/docs/index.md
machine_readable_contract:
  openapi: none
  asyncapi: none
  graphql: none
  note: >-
    No OpenAPI, Swagger, AsyncAPI or GraphQL SDL was ever published on a Blameless host. A
    Wayback CDX query over *.blameless.com filtered to openapi|swagger returns zero
    captures (checked 2026-08-29). The one OpenAPI 3.0.1 document in the GitHub org
    (blamelesshq/proxy-function deploy/azure/api-spec.yml) is an Azure Function App import
    descriptor for a customer-deployed Prometheus proxy — four undocumented GET stubs on a
    per-deployment azurewebsites.net host — and is deliberately NOT catalogued as the
    Blameless API contract.
status_page:
